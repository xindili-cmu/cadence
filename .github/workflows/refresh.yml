name: PT News Refresh

on:
  schedule:
    # Daily FULL sweep (Exa + PubMed + RSS) at 21:30 UTC (= 05:30 Beijing).
    # Mainland-first rhythm: the site's 今日信号 and the WeChat brief are fresh
    # before the Chinese morning peak, and the XHS digest cron (22:40 UTC =
    # 06:40 Beijing, xhs-digest.yml) runs right after this sweep. The US/UK
    # publishing day is long over by 21:30 UTC, so nothing is missed vs the
    # old 07:00 UTC slot.
    - cron: '30 21 * * *'
    # AIHOT-style high-frequency polling: PubMed + RSS only (the free legs),
    # every 2h at :25. The script exits before the LLM call when nothing new
    # arrived, so quiet runs cost nothing and write nothing.
    - cron: '25 */2 * * *'
  workflow_dispatch:  # allow manual trigger from Actions tab
    inputs:
      mode:
        description: 'full = Exa+PubMed+RSS · direct = PubMed+RSS only'
        type: choice
        options: [full, direct]
        default: full

permissions:
  contents: write

# Prevent two cron runs from racing on the same main branch
concurrency:
  group: news-refresh
  cancel-in-progress: false

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Gate: run the repo's own assertions before spending any API budget.
      # Both test files are pure node (assert/fs/path only), so this runs before
      # `npm install` and costs ~2s.
      #
      # Blocking on purpose. A wedged pipeline is LOUD (no daily edition — noticed
      # the same day, since publishing is manual 5x/week); bad data is SILENT
      # (2026-08-02: empty `journal` shipped for 5 days unnoticed, 29/75 rows).
      # Loud beats silent.
      #
      # The point of routing through `npm test` rather than naming scripts here:
      # any assertion added to the `test` script is picked up by every workflow
      # automatically. No workflow edit needed to wire up the next check — which
      # is the failure this step exists to end (lint-daily sat unwired 07-26→07-28;
      # these two test files sat unwired from the day they were written).
      - name: Assertions (npm test)
        run: npm test

      # satori + resvg + Noto fonts power the WeChat 2.35:1 cover banner
      # (wechat-brief.js → wechat-cover.js). Without node_modules the cover
      # render throws and is swallowed as "non-fatal", so the daily issue
      # shipped html/md/meta but no -cover.png. Same cache key as
      # xhs-digest.yml so both workflows share the ~200 MB font download.
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: xhs-deps-${{ hashFiles('package.json') }}

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run PT news refresh
        env:
          # Production site URL — fills the RSS channel <link> and atom:self link.
          # news-refresh.js falls back to this same domain if unset, but we set it
          # explicitly so it stays the source of truth.
          SITE_URL: https://incadencept.com
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          # LLM provider switch (Settings → Secrets and variables → Actions):
          # code default is deepseek + deepseek-v4-pro (needs Secret
          # DEEPSEEK_API_KEY). Override with repo Variable LLM_PROVIDER=anthropic
          # | gemini (+ matching Secret), or DEEPSEEK_MODEL=deepseek-v4-flash.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          # Embedding-based hot topics (Voyage). If the Secret is absent,
          # news-refresh.js silently falls back to the legacy tag-based heuristic.
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          # 2-hourly cron → free direct legs; daily 21:30 UTC cron and manual
          # dispatch (unless overridden) → full sweep.
          REFRESH_MODE: ${{ github.event.schedule == '25 */2 * * *' && 'direct' || github.event.inputs.mode || 'full' }}
        run: node scripts/news-refresh.js

      - name: Generate WeChat daily brief (full runs only)
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          REFRESH_MODE: ${{ github.event.schedule == '25 */2 * * *' && 'direct' || github.event.inputs.mode || 'full' }}
        run: node scripts/wechat-brief.js

      # Web daily edition (AIHOT-style /daily page): briefs/daily/YYYY-MM-DD.json
      # + index.json manifest. Skips itself on direct runs, same as the WeChat
      # brief. Committed by the briefs/ git-add below.
      - name: Generate web daily edition (full runs only)
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          REFRESH_MODE: ${{ github.event.schedule == '25 */2 * * *' && 'direct' || github.event.inputs.mode || 'full' }}
        run: node scripts/daily-brief.js

      # LinkedIn daily post text + signal card, generated from the edition the
      # previous step just wrote, so both are on origin BEFORE the Cowork task
      # (linkedin-daily-post, Mon–Fri 14:00 PT) stages the composer. Wired
      # 2026-09-01: the Chrome extension's file_upload has been broken at the
      # client layer since 08-28, so the only autonomous route for the card is
      # the page fetching it from raw.githubusercontent — which requires the
      # PNG to already be on origin. Pure-node, no LLM calls (satori + resvg
      # from node_modules, fonts vendored in vendor/fonts-ttf/). Date passed
      # EXPLICITLY: with no arg the scripts fall back to newest-on-disk, which
      # is correct here but silently wrong anywhere with a stale checkout.
      - name: Generate LinkedIn daily post + signal card (full runs only)
        if: ${{ github.event.schedule != '25 */2 * * *' && (github.event.inputs.mode || 'full') == 'full' }}
        run: |
          LATEST=$(ls briefs/daily | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' | sort | tail -1 | cut -d. -f1)
          node scripts/linkedin-brief.js "$LATEST"
          node scripts/linkedin-daily-card.js "$LATEST"

      # Field-completeness check on the edition we just generated (missing
      # titleZh/summaryZh, half-filled limitation pairs). Non-blocking on
      # purpose: a bad lint should show red in the Actions UI, not wedge the
      # daily publish. Wired in 2026-07-28 — the script existed since 07-26 but
      # was never called by CI, so three raw-scrape rows shipped unnoticed.
      #
      # LINT_META：把结论写进当天公众号那份 meta.txt 的末尾。非阻塞是对的（数据
      # 质量问题不该卡住出刊），但「非阻塞」不该等于「静音」—— 只活在 Actions 界面
      # 的信号在这个仓库里已经被漏掉过多次。meta.txt 是 Cindy 每天发布时一定会打开
      # 的文件（wechat-clip.sh 会 cat 它），信号送到那里就不依赖任何人记得去翻。
      #
      # 日期口径必须跟 wechat-brief.js 一致（`new Date().toISOString()` = UTC），
      # 不能用日刊的日期：日刊按北京日期命名，cron 21:30 UTC = 次日 05:30 北京，
      # 两者差一天。这个差异是刻意的（公众号刊头写的是美国日期），别去统一它。
      - name: Lint daily edition (non-blocking)
        continue-on-error: true
        run: LINT_META="briefs/$(date -u +%F).meta.txt" node scripts/lint-daily.js

      - name: Commit news.json (with race-safe retry)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          [ -f rss.xml ] && git add rss.xml || true
          # sitemap.xml is regenerated by news-refresh.js (buildSitemap) on every
          # run but was missing from this add list, so it was silently discarded
          # every time — the live sitemap froze at 2026-07-16 while GSC kept
          # crawling it, and 12 days of article URLs never got submitted.
          [ -f sitemap.xml ] && git add sitemap.xml || true
          [ -d briefs ] && git add briefs || true
          [ -d archive ] && git add archive || true
          [ -d linkedin ] && git add linkedin || true
          [ -f scrape-ledger.json ] && git add scrape-ledger.json || true
          if git diff --staged --quiet; then
            echo "No news.json changes to commit"
            exit 0
          fi
          git commit -m "📰 PT news $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."
            if git push; then
              echo "✓ Push succeeded on attempt $attempt"
              exit 0
            fi
            # Race: someone pushed mid-run. news.json is regenerated daily, so
            # the freshly generated file always wins — re-commit it on top of
            # the latest remote main instead of rebasing/merging (which can
            # conflict on news.json and wedge the job).
            echo "Push rejected — re-applying news.json onto latest origin/main..."
            git rebase --abort 2>/dev/null || true
            git merge --abort 2>/dev/null || true
            # NB: this list must stay in sync with the first-attempt add list
            # above. archive/ and sitemap.xml were missing here, so any run that
            # lost the push race had its archive append and its regenerated
            # sitemap thrown away by the reset --hard below.
            rm -rf /tmp/briefs /tmp/archive /tmp/linkedin
            cp news.json /tmp/news.json
            cp rss.xml /tmp/rss.xml 2>/dev/null || true
            cp sitemap.xml /tmp/sitemap.xml 2>/dev/null || true
            cp scrape-ledger.json /tmp/scrape-ledger.json 2>/dev/null || true
            cp -r briefs /tmp/briefs 2>/dev/null || true
            cp -r archive /tmp/archive 2>/dev/null || true
            cp -r linkedin /tmp/linkedin 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/news.json news.json
            cp /tmp/rss.xml rss.xml 2>/dev/null || true
            cp /tmp/sitemap.xml sitemap.xml 2>/dev/null || true
            cp /tmp/scrape-ledger.json scrape-ledger.json 2>/dev/null || true
            # `cp -r /tmp/briefs briefs` nests as briefs/briefs when the dir
            # already exists (it does — reset --hard restored it). Copy the
            # CONTENTS instead.
            [ -d /tmp/briefs ] && { mkdir -p briefs && cp -r /tmp/briefs/. briefs/; } || true
            [ -d /tmp/archive ] && { mkdir -p archive && cp -r /tmp/archive/. archive/; } || true
            [ -d /tmp/linkedin ] && { mkdir -p linkedin && cp -r /tmp/linkedin/. linkedin/; } || true
            git add news.json
            [ -f rss.xml ] && git add rss.xml || true
            [ -f sitemap.xml ] && git add sitemap.xml || true
            [ -d briefs ] && git add briefs || true
            [ -d archive ] && git add archive || true
            [ -d linkedin ] && git add linkedin || true
            [ -f scrape-ledger.json ] && git add scrape-ledger.json || true
            if git diff --staged --quiet; then
              echo "Remote already has identical news.json"
              exit 0
            fi
            git commit -m "📰 PT news $(date -u +%Y-%m-%d)"
          done
          echo "✗ Push failed after 3 attempts. Manual intervention required."
          exit 1
