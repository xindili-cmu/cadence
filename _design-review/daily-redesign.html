*{box-sizing:border-box}

.ctrl-brand b{color:#7FA5D0;font-weight:600;margin-left:4px}
.ctrl-sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8FB0D6}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{cursor:pointer;border:1px solid rgba(255,255,255,.22);background:transparent;color:#cfe0f2;font-family:var(--sans);font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;display:flex;align-items:center;gap:8px;transition:.15s}
.tab:hover{border-color:rgba(255,255,255,.5)}
.tab.on{background:#fff;color:#16314F;border-color:#fff}
.tab .ti{font-family:var(--mono);font-size:11px;opacity:.7}
.tab.on .ti{opacity:.55}
.spacer{flex:1}
.vp{display:flex;gap:4px;background:rgba(255,255,255,.1);border-radius:999px;padding:4px}
.vp button{cursor:pointer;border:none;background:transparent;color:#cfe0f2;font-family:var(--mono);font-size:12px;padding:6px 12px;border-radius:999px}
.vp button.on{background:#fff;color:#16314F}
.concept-note{max-width:1180px;margin:0 auto;padding:0 22px}
.concept-note .nb{max-width:1180px;margin:14px auto 0;background:#16314F;color:#cfe0f2;border-radius:12px;padding:12px 18px;font-size:13.5px;line-height:1.6}
.concept-note .nb b{color:#fff}

/* ===== Stage ===== */
.stage-wrap{padding:26px 22px 70px;display:flex;justify-content:center}
.stage{container-type:inline-size;background:var(--paper);width:100%;max-width:980px;border-radius:14px;box-shadow:0 8px 40px -16px rgba(20,30,45,.28);overflow:hidden;transition:max-width .25s}
.stage.mobile{max-width:402px}
.pad{padding:clamp(22px,4vw,46px)}

/* shared atoms */
.dot{width:7px;height:7px;border-radius:2px;display:inline-block}
.kicker{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);display:flex;align-items:center;gap:8px}
.rule{flex:1;height:1px;background:var(--line)}
.headrow{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sechead{display:flex;align-items:baseline;gap:14px;margin-bottom:18px}
.sechead h3{margin:0;font-weight:600;font-size:19px;letter-spacing:-.01em;color:var(--ink900)}
.sechead .cnt{font-family:var(--mono);font-size:13px;color:var(--ink600)}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:9px;font-family:var(--mono);font-size:12px;color:#8A8F98;margin-bottom:12px}
.meta .sep{color:#D8D4C8}
.meta .cat{display:inline-flex;align-items:center;gap:7px}
.meta b{font-weight:600}
a.card{display:block;text-decoration:none;color:inherit}

/* ===== MASTHEAD (shared base) ===== */
.mast{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.mast .eq{position:absolute;right:-16px;bottom:-24px;opacity:.12;pointer-events:none}
.mast .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#8FB0D6;margin-bottom:16px}
.mast h1{margin:0;font-family:var(--serif);font-weight:900;font-size:clamp(30px,6cqw,52px);line-height:1.05;letter-spacing:.01em}
.mast .info{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:#AFC4DC}
.mast .info b{color:#fff;font-weight:600}
.mast .dots{display:flex;flex-wrap:wrap;gap:6px 16px}
.mast .dots span{display:flex;align-items:center;gap:7px;white-space:nowrap}

@container (max-width:560px){
  .pad{padding:20px}
  .mast h1{font-size:30px}
  .sechead h3{font-size:17px}

  const counts={}; DATA.items.forEach(s=>counts[s.cat]=(counts[s.cat]||0)+1);
  return Object.entries(counts).sort((a,b)=>(order[a[0]]??99)-(order[b[0]]??99))
    .map(([c,n])=>`<span><span class="dot" style="background:${catOf(c).dot}"></span>${catOf(c).short} <b>${n}</b></span>`).join('');
}
function meta(s){
  const c=catOf(s.cat);
  return `<div class="meta"><span class="cat" style="color:#5A6068"><span class="dot" style="background:${c.c}"></span>${c.zh}</span>`
    +`<span class="sep">/</span><span>信号分 <b style="color:${scoreColor(s.score)}">${s.score}</b></span>`
    +`<span class="sep">/</span><span style="text-transform:uppercase;letter-spacing:.06em">${esc(s.src)}</span></div>`;
}

  const {ds,wd}=dateBits();

  <header class="mast pad">${EQ}
    <div style="position:relative">
      <div class="eyebrow">每日简报 · Daily Briefing</div>
      <h1>今日康复信号</h1>
      <div class="info">
        <span>${ds}　${wd}　· 今日 <b>${DATA.stats.events}</b> 篇</span>
        <span class="dots">${dotsRow()}</span>

    </div>
  </header>
  <div class="pad" style="padding-top:clamp(30px,5cqw,52px)">
    <div class="headrow"><span class="kicker">${CLOCK} 只有 5 分钟？读这条</span><span class="rule"></span></div>
    <a class="card" href="${lead.url}" style="background:#fff;border:1px solid var(--line);border-radius:18px;padding:clamp(22px,4cqw,38px);box-shadow:0 1px 2px rgba(27,30,35,.03),0 18px 40px -28px rgba(27,30,35,.22);display:block">
      <div class="meta" style="font-size:13px;gap:11px"><span class="cat" style="color:${c.c}"><span class="dot" style="background:${c.c}"></span>${c.zh}</span><span class="sep">/</span><span>信号分 <b style="color:${scoreColor(lead.score)}">${lead.score}</b></span><span class="sep">/</span><span style="text-transform:uppercase;letter-spacing:.08em">${esc(lead.src)}</span></div>
      <h2 style="margin:0;font-weight:600;font-size:clamp(21px,3.6cqw,29px);line-height:1.3;letter-spacing:-.01em;color:var(--ink900)">${esc(lead.t)}</h2>
      <p style="margin:16px 0 0;font-size:16px;line-height:1.78;color:#43474E">${esc(lead.s)}</p>
      <div style="margin-top:24px;background:var(--tint);border:1px solid var(--tint-line);border-radius:13px;padding:20px 22px">
        <div style="font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-deep);margin-bottom:11px">临床底线 · Take</div>

    <div style="display:flex;flex-direction:column;gap:16px">
      ${tier2.map(s=>`<a class="card" href="${s.url}" style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px">
        ${meta(s)}
        <h4 style="margin:0;font-weight:600;font-size:clamp(16px,2.4cqw,19px);line-height:1.4;color:var(--ink900)">${esc(s.t)}</h4>
        ${s.s?`<p style="margin:11px 0 0;font-size:14.5px;line-height:1.72;color:#5A6068">${esc(s.s)}</p>`:''}
      </a>`).join('')}

  <div class="pad" style="padding-top:6px">
    <div class="sechead"><h3>了解即可</h3><span class="rule"></span><span class="cnt">${tier3.length} 条</span></div>
    <div>
      ${tier3.map(s=>`<a class="card" href="${s.url}" style="display:flex;align-items:center;gap:16px;padding:15px 4px;border-bottom:1px solid var(--line2)">
        <span style="flex:none;width:32px;font-family:var(--mono);font-size:15px;font-weight:600;color:${scoreColor(s.score)}">${s.score}</span>
        <span style="flex:1;min-width:0;font-size:15px;line-height:1.5;color:#262A30">${esc(s.t)}</span>
        <span style="flex:none;display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:#8A8F98"><span class="dot" style="background:${catOf(s.cat).c}"></span>${catOf(s.cat).short}</span>

/* ============ CONCEPT B — 信号墙 Signal Board (dense, score-forward) ============ */
function conceptB(){
  const {ds,wd}=dateBits();
  const c=catOf(lead.cat);
  const pulse=Object.entries(DATA.items.reduce((a,s)=>(a[s.cat]=(a[s.cat]||0)+1,a),{}))
    .sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<span style="white-space:nowrap">${catOf(k).short} <b style="color:#fff">${n}</b></span>`).join('<span style="color:#3a5a7e">·</span>');
  return `
  <header class="mast pad" style="padding-bottom:0">${EQ}
    <div style="position:relative">
      <div class="eyebrow">每日简报 · ${ds} ${wd}</div>
      <h1 style="font-size:clamp(28px,5.4cqw,46px)">今日康复信号</h1>
      <div style="margin-top:18px;display:flex;flex-wrap:wrap;gap:8px 16px;font-family:var(--mono);font-size:12.5px;color:#AFC4DC;align-items:center">${pulse}</div>
      <div style="margin-top:18px;padding:14px 0 18px;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;font-family:var(--mono);font-size:12.5px;color:#9FB6D4;flex-wrap:wrap;gap:10px"><span>共 <b style="color:#fff">${DATA.stats.events}</b> 篇 · ${DATA.stats.specialties} 个专业</span><span>最高信号分 <b style="color:#fff">${DATA.stats.topScore}</b></span></div>
    </div>
  </header>
  <div class="pad">
    <div class="headrow"><span class="kicker">${CLOCK} 头条 · 5 分钟必读</span><span class="rule"></span></div>
    <a class="card" href="${lead.url}" style="display:grid;grid-template-columns:96px 1fr;gap:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden">
      <div style="background:${c.c};color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 8px;text-align:center">
        <div style="font-family:var(--mono);font-size:34px;font-weight:600;line-height:1">${lead.score}</div>
        <div style="font-family:var(--mono);font-size:10px;letter-spacing:.12em;opacity:.85;margin-top:6px">信号分</div>
      </div>
      <div style="padding:clamp(20px,3.6cqw,32px)">
        <div class="meta"><span class="cat" style="color:${c.c}"><span class="dot" style="background:${c.c}"></span>${c.zh}</span><span class="sep">/</span><span style="text-transform:uppercase;letter-spacing:.06em">${esc(lead.src)}</span></div>
        <h2 style="margin:0;font-weight:600;font-size:clamp(20px,3.2cqw,26px);line-height:1.32;color:var(--ink900)">${esc(lead.t)}</h2>
        <div style="margin-top:16px;border-left:3px solid var(--blue);padding-left:14px"><div style="font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-deep);margin-bottom:7px">临床底线</div><p style="margin:0;font-size:14.5px;line-height:1.72;color:#3B414A">${esc(lead.why)}</p></div>
      </div>
    </a>
  </div>
  <div class="pad" style="padding-top:0">
    <div class="sechead"><h3>值得细读</h3><span class="rule"></span><span class="cnt">${tier2.length} 条</span></div>
    <div class="gridB">
      ${tier2.map(s=>{const cc=catOf(s.cat);return `<a class="card" href="${s.url}" style="position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 20px 20px 22px;overflow:hidden">
        <span style="position:absolute;left:0;top:0;bottom:0;width:4px;background:${cc.c}"></span>
        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:9px"><span style="font-family:var(--mono);font-size:22px;font-weight:600;color:${scoreColor(s.score)};line-height:1">${s.score}</span><span style="font-family:var(--mono);font-size:11px;color:${cc.c}">${cc.short}</span><span style="flex:1"></span><span style="font-family:var(--mono);font-size:11px;color:#9AA0A8;text-transform:uppercase">${esc(s.src)}</span></div>
        <h4 style="margin:0;font-weight:600;font-size:16px;line-height:1.42;color:var(--ink900)">${esc(s.t)}</h4>
        ${s.s?`<p style="margin:9px 0 0;font-size:13.5px;line-height:1.65;color:#5A6068">${esc(s.s)}</p>`:''}
      </a>`}).join('')}
    </div>
  </div>
  <div class="pad" style="padding-top:6px">
    <div class="sechead"><h3>了解即可</h3><span class="rule"></span><span class="cnt">${tier3.length} 条</span></div>
    <div class="grid3">
      ${tier3.map(s=>`<a class="card" href="${s.url}" style="display:flex;align-items:center;gap:12px;padding:11px 12px;background:#fff;border:1px solid var(--line2);border-radius:9px">
        <span style="flex:none;width:26px;font-family:var(--mono);font-size:13.5px;font-weight:600;color:${scoreColor(s.score)}">${s.score}</span>
        <span style="flex:none;width:6px;height:6px;border-radius:2px;background:${catOf(s.cat).c}"></span>
        <span style="flex:1;min-width:0;font-size:13.5px;line-height:1.45;color:#2A2E34;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(s.t)}</span>
      </a>`).join('')}

  <style>
    .gridB{display:grid;grid-template-columns:1fr 1fr;gap:14px}

    @container (max-width:640px){.gridB{grid-template-columns:1fr}.grid3{grid-template-columns:1fr}}
  </style>`;
}

/* ============ CONCEPT C — 查房动线 Rounds Timeline (minimal) ============ */
function conceptC(){
  const {ds,wd}=dateBits();
  function node(s,opts={}){
    const cc=catOf(s.cat);
    return `<a class="card tl-node" href="${s.url}">
      <div class="tl-rail"><span class="tl-score" style="color:${scoreColor(s.score)}">${s.score}</span><span class="tl-dot" style="background:${cc.c}"></span></div>
      <div class="tl-body">
        <div class="meta" style="margin-bottom:8px"><span class="cat" style="color:${cc.c}"><span class="dot" style="background:${cc.c}"></span>${cc.zh}</span><span class="sep">/</span><span style="text-transform:uppercase;letter-spacing:.06em">${esc(s.src)}</span></div>
        <div style="font-weight:600;font-size:${opts.lead?'clamp(20px,3.2cqw,26px)':'16.5px'};line-height:1.4;color:var(--ink900)">${esc(s.t)}</div>
        ${opts.lead?`<p style="margin:14px 0 0;font-size:15.5px;line-height:1.76;color:#43474E">${esc(s.s)}</p>
          <div style="margin-top:16px;background:var(--tint);border:1px solid var(--tint-line);border-radius:11px;padding:16px 18px"><div style="font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--blue-deep);margin-bottom:8px">临床底线 · Take</div><p style="margin:0;font-size:14.5px;line-height:1.74;color:#2B3138">${esc(s.why)}</p></div>`
          :(opts.sum&&s.s?`<p style="margin:7px 0 0;font-size:13.5px;line-height:1.6;color:#6A7068">${esc(s.s)}</p>`:'')}
      </div>
    </a>`;
  }
  function divider(label,n){return `<div class="tl-div"><span class="tl-div-rail"></span><span class="tl-div-label">${label}</span><span style="font-family:var(--mono);font-size:11px;color:var(--ink400)">${n} 条</span><span class="rule"></span></div>`;}
  return `
  <header class="mast pad" style="background:linear-gradient(180deg,#16314F,#1b3a5f);padding-top:28px;padding-bottom:26px">${EQ}
    <div style="position:relative">
      <div style="display:flex;align-items:baseline;gap:12px;flex-wrap:wrap">
        <span style="font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8FB0D6">晨间查房</span>
        <span style="font-family:var(--mono);font-size:12px;color:#AFC4DC">${ds} ${wd} · ${DATA.stats.events} 篇</span>
      </div>
      <h1 style="font-size:clamp(26px,5cqw,42px);margin-top:10px">按信号分排出的今日动线</h1>
    </div>
  </header>
  <div class="pad tl">
    ${divider('5 分钟必读',1)}
    ${node(lead,{lead:true})}
    ${divider('值得细读',tier2.length)}
    ${tier2.map(s=>node(s,{sum:true})).join('')}
    ${divider('了解即可',tier3.length)}
    ${tier3.map(s=>node(s)).join('')}
  </div>
  <style>
    .tl{position:relative}
    .tl-div{display:flex;align-items:center;gap:12px;margin:30px 0 16px}
    .tl-div:first-child{margin-top:0}
    .tl-div-rail{width:54px;flex:none}
    .tl-div-label{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
    .tl-node{display:flex;gap:18px;padding:14px 0;border-bottom:1px solid var(--line2)}
    .tl-rail{width:54px;flex:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:2px;position:relative}
    .tl-rail:before{content:"";position:absolute;top:-16px;bottom:-16px;left:50%;width:1px;background:var(--line);transform:translateX(-.5px)}
    .tl-score{font-family:var(--mono);font-size:18px;font-weight:600;background:var(--paper);z-index:1;padding:2px 0}
    .tl-dot{width:9px;height:9px;border-radius:3px;background:#999;z-index:1;box-shadow:0 0 0 4px var(--paper)}
    .tl-body{flex:1;min-width:0}
    @container (max-width:560px){.tl-rail{width:40px}.tl-div-rail{width:40px}.tl-node{gap:12px}}
  </style>`;
}

const CONCEPTS={
  A:{name:'A · 聚焦',ti:'Focus',note:'<b>聚焦 Focus</b> — 现有版式的精修：保留 navy 刊头与「5 分钟」头条，加大字号与留白，单栏编辑流。改动最小、最稳，主打<b>视觉刷新</b>。',fn:conceptA},
  B:{name:'B · 信号墙',ti:'Board',note:'<b>信号墙 Board</b> — 信号分前置：头条带大号分数块，「值得细读」改双栏卡片(色条标专业)，「了解即可」做密排网格。信息密度高、可扫读，主打<b>层级重组</b>。',fn:conceptB},
  C:{name:'C · 查房动线',ti:'Timeline',note:'<b>查房动线 Timeline</b> — 极简单流：全部内容按信号分排成一条带左侧分数轨的时间线，分区只用安静的分隔标。最克制、移动端最顺，主打<b>移动体验</b>。',fn:conceptC},
};
let cur='A', vp='desktop';
const stage=document.getElementById('stage'), tabsEl=document.getElementById('tabs'), noteEl=document.getElementById('note');
Object.entries(CONCEPTS).forEach(([k,c])=>{
  const b=document.createElement('button');b.className='tab'+(k===cur?' on':'');b.dataset.k=k;
  b.innerHTML=`${c.name} <span class="ti">${c.ti}</span>`;b.onclick=()=>{cur=k;render();};tabsEl.appendChild(b);
});
document.querySelectorAll('.vp button').forEach(b=>b.onclick=()=>{vp=b.dataset.vp;render();});
function render(){
  stage.className='stage'+(vp==='mobile'?' mobile':'');
  stage.innerHTML=CONCEPTS[cur].fn();
  noteEl.innerHTML=CONCEPTS[cur].note;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.k===cur));
  document.querySelectorAll('.vp button').forEach(t=>t.classList.toggle('on',t.dataset.vp===vp));
  window.scrollTo({top:0});
}
render();
</script>
</body>
</html>
